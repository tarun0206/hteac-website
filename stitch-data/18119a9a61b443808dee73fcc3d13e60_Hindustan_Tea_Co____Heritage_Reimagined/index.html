<div class="absolute inset-0 w-full h-full" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_7" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_7');
  const devicePixelRatio = window.devicePixelRatio || 1;
  (function() {
  const container = document.getElementById('threejs-container-BOTANICAL_SCENE');
  const width = container.clientWidth || window.innerWidth;
  const height = container.clientHeight || window.innerHeight;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
  renderer.setSize(width, height);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  container.appendChild(renderer.domElement);

  // Cinematic Lighting
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.1);
  scene.add(ambientLight);

  const topLight = new THREE.SpotLight(0xc9a34a, 1.5, 20, Math.PI / 6, 0.5);
  topLight.position.set(2, 5, 2);
  scene.add(topLight);

  const rimLight = new THREE.DirectionalLight(0xffffff, 0.4);
  rimLight.position.set(-5, 2, -2);
  scene.add(rimLight);

  // Sculptural Tea Branch Group
  const branchGroup = new THREE.Group();

  const createLeaf = (x, y, z, rx, ry, rz, scale = 1) => {
    const leafShape = new THREE.Shape();
    leafShape.moveTo(0, 0);
    leafShape.quadraticCurveTo(0.4, 0.5, 0, 1.5);
    leafShape.quadraticCurveTo(-0.4, 0.5, 0, 0);

    const extrudeSettings = { depth: 0.02, bevelEnabled: true, bevelThickness: 0.01, bevelSize: 0.02, bevelSegments: 3 };
    const geometry = new THREE.ExtrudeGeometry(leafShape, extrudeSettings);
    
    // Premium Matte Green Material
    const material = new THREE.MeshPhongMaterial({ 
      color: 0x102820, 
      shininess: 30,
      specular: 0x2D4A32
    });

    const leaf = new THREE.Mesh(geometry, material);
    leaf.position.set(x, y, z);
    leaf.rotation.set(rx, ry, rz);
    leaf.scale.set(scale, scale, scale);
    return leaf;
  };

  // Main stem
  const stemGeometry = new THREE.CylinderGeometry(0.015, 0.025, 3, 8);
  const stemMaterial = new THREE.MeshPhongMaterial({ color: 0x071B16 });
  const stem = new THREE.Mesh(stemGeometry, stemMaterial);
  stem.rotation.z = Math.PI / 10;
  branchGroup.add(stem);

  // Add sculptural leaves
  branchGroup.add(createLeaf(0.1, 0.8, 0.05, Math.PI/3, 0, 0.5, 0.8));
  branchGroup.add(createLeaf(-0.1, 0.4, -0.05, -Math.PI/4, Math.PI, -0.4, 1.2));
  branchGroup.add(createLeaf(0.2, -0.2, 0.1, Math.PI/2, 0.5, 0.2, 1.1));
  branchGroup.add(createLeaf(-0.15, -0.7, -0.1, -Math.PI/3, -0.5, -0.1, 0.9));
  branchGroup.add(createLeaf(0.05, 1.2, 0, Math.PI/6, 0, 0.1, 0.6));

  scene.add(branchGroup);

  camera.position.z = 6;

  let mouseX = 0;
  let mouseY = 0;
  let targetX = 0;
  let targetY = 0;

  window.addEventListener('mousemove', (e) => {
    mouseX = (e.clientX / window.innerWidth) - 0.5;
    mouseY = (e.clientY / window.innerHeight) - 0.5;
  });

  const animate = () => {
    requestAnimationFrame(animate);
    
    targetX += (mouseX - targetX) * 0.02;
    targetY += (mouseY - targetY) * 0.02;

    branchGroup.rotation.y += 0.002; // Very slow ambient rotation
    branchGroup.rotation.x = targetY * 0.3;
    branchGroup.rotation.y += targetX * 0.3;

    renderer.render(scene, camera);
  };

  window.addEventListener('resize', () => {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  });

  animate();
})();
})();
</script>
