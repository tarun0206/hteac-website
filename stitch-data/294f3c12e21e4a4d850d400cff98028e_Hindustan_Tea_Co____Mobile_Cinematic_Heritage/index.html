<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary mb-6">

<div class="h-px w-12 bg-primary/40"></div>
</div>

</div>
<button class="group flex items-center justify-center gap-2 font-label-caps text-label-caps text-primary hover:text-primary-fixed-dim transition-colors duration-300 py-2 w-full text-center" type="submit">
